# Helper package for scripts/check_asm.py: cargo compiles ../probes.rs as a
# library unit so `cargo rustc -- --emit asm` can emit its assembly with full
# dependency resolution (manual rustc --extern cannot pair this cargo's
# split rlib/rmeta artifacts).
#
# Most or all contents generated by AI (model glm-5.3)
[package]
name = "asm-probes"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
path = "../probes.rs"

[dependencies]
lightweight-simd = { path = "../../..", features = ["complex", "half"] }
