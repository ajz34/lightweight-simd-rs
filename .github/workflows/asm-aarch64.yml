# Most or all contents generated by AI (model glm-5.3)
#
# Assembly-level vectorization verification on aarch64 (docs/adr/0004).
# GitHub's macOS runners are Apple Silicon, so the NEON/fmla expectation
# table runs natively without cross-compilation tooling.
name: asm verification (aarch64)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: asm-aarch64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-asm:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@nightly

      # check_asm.py exits 0 in its "cross-emission not wired up"
      # scaffolding mode when --arch does not match the host; pin the
      # runner arch so a silently-skipped matrix cannot pass green
      # (macOS reports arm64; rustc calls it aarch64).
      - name: pin runner architecture
        run: test "$(uname -m)" = "arm64"

      - name: check asm matrix
        run: python3 scripts/check_asm.py --arch aarch64
