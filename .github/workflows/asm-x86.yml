# Most or all contents generated by AI (model glm-5.3)
#
# Assembly-level vectorization verification on x86-64 (docs/adr/0004):
# compiles the black-box-fenced probes for each -C target-cpu row and
# asserts the expected instruction families. Emission is compile-only,
# so rows the runner cannot execute (e.g. x86-64-v4 without AVX-512
# hardware) are still checked.
name: asm verification (x86-64)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: asm-x86-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-asm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@nightly

      # check_asm.py exits 0 in its "cross-emission not wired up"
      # scaffolding mode when --arch does not match the host; pin the
      # runner arch so a silently-skipped matrix cannot pass green.
      - name: pin runner architecture
        run: test "$(uname -m)" = "x86_64"

      - name: check asm matrix
        run: python3 scripts/check_asm.py --arch x86_64
