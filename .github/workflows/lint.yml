# Most or all contents generated by AI (model glm-5.3)
#
# rustfmt + clippy for the crate and the asm-probes helper package. The
# toolchain comes from rust-toolchain.toml (nightly), so clippy tracks the
# same moving target as local development.
name: lint (fmt + clippy)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy

      - name: rustfmt (crate and asm probes)
        run: |
          cargo fmt --all --check
          cargo fmt --manifest-path scripts/asm/probes/Cargo.toml --all --check

      - name: clippy (default features)
        run: cargo clippy --all-targets -- -D warnings

      - name: clippy (all features)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: clippy (asm probes package)
        run: cargo clippy --manifest-path scripts/asm/probes/Cargo.toml --all-targets --all-features -- -D warnings
