# Most or all contents generated by AI (model glm-5.3)
#
# Unit, integration, and doc tests. The OS axis is deliberate: ubuntu
# (x86-64, no target flags) takes the separated mul+add cfg branch of
# docs/adr/0005, macos (aarch64, hardware FMA) the fused MulAdd branch,
# and --features use_libm_fma the libm branch on ubuntu — together the
# matrix exercises every cfg arm.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        flags: ["", "--all-features", "--features use_libm_fma"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@nightly

      - name: cargo test
        run: cargo test ${{ matrix.flags }}
