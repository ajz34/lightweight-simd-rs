[package]
name = "lightweight-simd"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Lightweight generic fixed-array vector types relying on compiler auto-vectorization"
repository = "https://github.com/ajz34/lightweight-simd-rs"
readme = "README.md"
keywords = ["simd", "vector", "numeric"]
categories = ["science", "mathematics"]

[dependencies]
duplicate = "2.0"
num-traits = "0.2"
num-complex = { version = "0.4", optional = true }
half = { version = "2", optional = true, features = ["num-traits"] }

[dev-dependencies]
num-complex = "0.4"
half = { version = "2", features = ["num-traits"] }
rayon = "1"

[features]
complex = ["dep:num-complex"]
half = ["dep:half"]
# mul_add/fma_from via the element's fused MulAdd: single rounding, hardware
# FMA with no extra flags, slow correctly-rounded libm fma on pre-FMA targets.
# Default (off): separated mul+add; fuses to hardware FMA only under
# -C llvm-args=-fp-contract=fast. See docs/adr/0005.
use_libm_fma = []

[profile.dev]
opt-level = 2
